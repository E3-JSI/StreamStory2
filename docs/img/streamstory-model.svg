<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">StreamStory: a yearly weather cycle as states and transitions</title>
<desc id="d">Twenty years of monthly temperature and rainfall summarised by StreamStory as six states forming a yearly cycle. Circle area shows the share of time in each state, arrow width the probability of moving to the next state; the selected state has a blue border and blue outgoing arrows.</desc>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.flow{stroke-dasharray:5 17;animation:flow 1.1s linear infinite}@keyframes flow{to{stroke-dashoffset:-44}}</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
<radialGradient id="g-low" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="hsl(200, 85%, 64%)"/><stop offset="1" stop-color="hsl(200, 85%, 42%)"/></radialGradient>
<radialGradient id="g-aprmay" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="hsl(22, 38%, 64%)"/><stop offset="1" stop-color="hsl(22, 38%, 42%)"/></radialGradient>
<radialGradient id="g-highest" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="hsl(140, 60%, 64%)"/><stop offset="1" stop-color="hsl(140, 60%, 42%)"/></radialGradient>
<radialGradient id="g-oct" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="hsl(335, 80%, 64%)"/><stop offset="1" stop-color="hsl(335, 80%, 42%)"/></radialGradient>
<radialGradient id="g-nov" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="hsl(318, 70%, 64%)"/><stop offset="1" stop-color="hsl(318, 70%, 42%)"/></radialGradient>
<radialGradient id="g-lowest" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="hsl(258, 55%, 64%)"/><stop offset="1" stop-color="hsl(258, 55%, 42%)"/></radialGradient>
<marker id="arrow" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 L3,6 z" fill="#cbd5e1" fill-opacity="0.7"/></marker>
<marker id="arrow-dim" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 L3,6 z" fill="#cbd5e1" fill-opacity="0.35"/></marker>
<marker id="arrow-blue" viewBox="0 0 12 12" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 L3,6 z" fill="hsl(212, 90%, 62%)"/></marker>
</defs>
<rect x="0" y="0" width="1200" height="620" rx="24" fill="url(#bg)"/>
<g filter="url(#glow)" opacity="0.24"><circle cx="985" cy="315" r="150" fill="hsl(140, 70%, 45%)"/><circle cx="470" cy="270" r="160" fill="hsl(225, 70%, 55%)"/><circle cx="710" cy="500" r="110" fill="hsl(325, 60%, 50%)"/></g>
<text x="48" y="58" font-size="30" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">StreamStory</text>
<text x="48" y="84" font-size="15" fill="#94a3b8">20 years of monthly temperature and rainfall, summarised as a yearly cycle of six states</text>
